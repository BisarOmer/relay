name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: engine/go.sum
      - name: Test
        working-directory: engine
        run: go test ./...
      - name: Vet
        working-directory: engine
        run: go vet ./...
      - name: Race (selected)
        working-directory: engine
        run: go test -race ./internal/ipc ./internal/logging

  go-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: engine/go.sum
      - name: Start NATS with JetStream
        run: |
          docker run -d --name relay-nats -p 4222:4222 -p 8222:8222 nats:2.11-alpine -js -m 8222
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "NATS failed to become healthy" >&2
          exit 1
      - name: Integration tests
        working-directory: engine
        env:
          RELAY_NATS_URL: nats://127.0.0.1:4222
        run: go test -tags=integration ./internal/adapters/nats -count=1 -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vite build
